<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Шинторг WMS</title>
    <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="card border-dark" style="width:360px">
    <div class="card-header bg-dark text-white">
        <strong>Шинторг WMS</strong> &mdash; Складской учёт
    </div>
    <div class="card-body p-4">
        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login">
            <div class="mb-3">
                <label class="form-label fw-bold small text-uppercase">Логин</label>
                <input type="text" name="username" class="form-control form-control-sm" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small text-uppercase">Пароль</label>
                <input type="password" name="password" class="form-control form-control-sm" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Войти</button>
        </form>
    </div>
</div>
<script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
